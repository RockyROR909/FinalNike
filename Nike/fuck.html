<style>
/* Контейнер секции для ограничения максимальной ширины на странице */
.cta-section {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}

.cta-card {
  background-color: #eafbea; /* Очень светлый зеленый фон */
  border-radius: 4px;
  text-align: center;
  box-sizing: border-box; /* Чтобы padding не увеличивал заданные размеры */
  
  /* Точные размеры по вашему ТЗ */
  width: 1146px;
  height: 367px;
  
  /* Внутренние отступы сбалансированы под новую высоту блока */
  padding: 60px 40px; 
  
  /* Идеальное центрирование содержимого по вертикали и горизонтали */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Заголовок блока */
.cta-title {
  font-size: 42px;
  font-weight: 700;
  color: #000000;
  margin: 0 0 16px 0;
  letter-spacing: -0.5px;
}

/* Описание */
.cta-description {
  font-size: 16px;
  line-height: 1.6;
  color: #555555;
  margin: 0 0 32px 0; /* Отступ до кнопки */
  max-width: 500px;
}

/* Зеленая кнопка */
.cta-button {
  background-color: #5cb85c;
  color: #ffffff;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 16px 40px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(92, 184, 92, 0.2);
  transition: all 0.2s ease;
}

.cta-button:hover {
  background-color: #4cae4c;
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(92, 184, 92, 0.3);
}

.cta-button:active {
  transform: translateY(0);
}

/* --- АДАПТИВНОСТЬ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ --- */
@media (max-width: 768px) {
  .cta-card {
    padding: 50px 20px; /* Уменьшаем отступы на маленьких экранах */
  }
  
  .cta-title {
    font-size: 32px; /* Уменьшаем шрифт заголовка */
  }
  
  .cta-description {
    font-size: 14px;
    br {
      display: none; /* Отменяем принудительный перенос строк на смартфонах */
    }
  }
}


.site-footer {
  width: 100%;
  background-color: #ffffff;
  border-bottom: 24px solid #5cb85c; /* Декоративная зеленая полоса в самом низу страницы */
  box-sizing: border-box;
}

/* Ограничивающий контейнер по центру страницы */
.footer-container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 20px;
  
  /* Выстраиваем все 3 главных блока в один ряд */
  display: flex;
  align-items: center;
  justify-content: space-between; /* Распределяет элементы по краям */
  gap: 30px;
}

/* 1. Блок логотипа */
.footer-logo {
  display: flex;
  align-items: center;
}

/* 2. Меню навигации */
.footer-nav {

  gap: 40px; /* Отступы между ссылками */

.nav-link {

  font-weight: 500;

  text-decoration: none;
  transition: color 0.2s ease;
}

.nav-link:hover {

}

/* 3. Блок социальных сетей */
.footer-socials {

  align-items: center;
  gap: 20px;
}

.socials-title {

/* Круглые кнопки для иконок */
.icon-btn {
  width: 36px;
  height: 36px;

  align-items: center;
  justify-content: center;
  text-decoration: none;
  font-size: 16px;
  font-weight: bold;
  font-family: sans-serif;
  transition: transform 0.2s ease, background-color 0.2s ease;
}

.icon-btn:hover {
  transform: scale(1.1);
  background-color: #4cae4c;
